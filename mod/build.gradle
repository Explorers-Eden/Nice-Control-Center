plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "nice-control-center"
}

// The Minecraft version to build for: -Pmc_target=26.2 reads versions/26.2.properties (Minecraft and Fabric API
// versions, the dependency range and which version-specific sources to add). Without it: the newest.
def mcTarget = (findProperty("mc_target") ?: "26.3").toString()
def targetFile = file("versions/${mcTarget}.properties")
if (!targetFile.exists()) throw new GradleException("No versions/${mcTarget}.properties")
def target = new Properties()
targetFile.withInputStream { target.load(it) }
target.each { key, value -> project.ext.set(key.toString(), value.toString()) }

sourceSets {
	main {
		java {
			srcDir "src/mc/${project.source_dir}/java"
		}
	}
}

repositories {
	// Mod Menu: optional, only for the in-game settings screen in singleplayer.
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Permission nodes for LuckPerms (or any other Fabric permissions mod).
	// Falls back to vanilla operator levels when no permissions mod is installed.
	implementation "me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"
	include "me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	def minecraftDep = project.minecraft_dep
	inputs.property "minecraftDep", minecraftDep
	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_dep": minecraftDep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_nice-control-center" }
	}
}
