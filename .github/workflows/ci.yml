# One workflow for everything Nice Control Center:
#
#   Fabric mod  (mod/)     build the jar        → publish it as a GitHub release (newest per Minecraft version)
#   Panel       (panel/)   build the fat jar    → build the Docker image niceron/nicecontrolcenter and push it to Docker Hub
#
# Each part only runs when its files changed. The panel also depends on mod/src/main (shared Java classes and
# the dashboard's web files are compiled into it). Images and releases are only published from main.
# Version, Minecraft version and release title of the mod come from mod/tools/release_infos.yml; the release notes
# are mod/changelog.log. Pushing to main without raising the version refreshes that version's release.
# Running it by hand (Actions → Nice Control Center → Run workflow) on main does everything.
name: Nice Control Center

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Find out what changed
    runs-on: ubuntu-24.04
    outputs:
      mod: ${{ steps.filter.outputs.mod }}
      panel: ${{ steps.filter.outputs.panel }}
    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide which parts need to run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            workflow_dispatch)
              mod=true; panel=true ;;
            *)
              base="$BEFORE"
              [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
              if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
                changed=$(git diff --name-only "$base" "$GITHUB_SHA")
              else
                # New branch or rewritten history: treat everything as changed.
                changed=$(git ls-files)
              fi
              echo "Changed files:"; echo "$changed"
              mod=false; panel=false
              echo "$changed" | grep -qE '^(mod/|\.github/workflows/)' && mod=true
              echo "$changed" | grep -qE '^(panel/|mod/src/main/|\.github/workflows/)' && panel=true
              ;;
          esac
          echo "Mod: $mod, panel: $panel"
          echo "mod=$mod" >> "$GITHUB_OUTPUT"
          echo "panel=$panel" >> "$GITHUB_OUTPUT"

  mod-build:
    name: "Mod: build the jar for Minecraft ${{ matrix.mc }}"
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Same list as Meta Data -> Versions in mod/tools/release_infos.yml.
        mc: ["26.3", "26.2", "26.1"]
    env:
      MC_TARGET: ${{ matrix.mc }}
    defaults:
      run:
        working-directory: mod
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Make sure the Gradle wrappers are genuine
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Python 3.12 for the release scripts
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read version and Minecraft version from tools/release_infos.yml
        id: meta
        run: |
          pip install pyyaml
          python tools/scripts/read-release-metadata.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Build the mod jar (version ${{ steps.meta.outputs.version_number }})
        run: ./gradlew build -Pversion=${{ steps.meta.outputs.version_number }} -Pmc_target=${{ matrix.mc }}

      - name: Upload the jar as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nice-control-center-mc${{ matrix.mc }}
          path: mod/build/libs/

  mod-release:
    name: "Mod: publish the GitHub release for Minecraft ${{ matrix.mc }}"
    needs: [changes, mod-build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mc: ["26.3", "26.2", "26.1"]
    env:
      MC_TARGET: ${{ matrix.mc }}
    permissions:
      contents: write
    # Never publish two releases at the same time.
    concurrency:
      group: mod-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mod
    steps:
      - name: Check out the repository (release scripts and changelog)
        uses: actions/checkout@v6

      - name: Set up Python 3.12 for the release scripts
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read version, tag and release name from tools/release_infos.yml
        id: meta
        run: |
          pip install pyyaml
          python tools/scripts/read-release-metadata.py

      - name: Download the jar built by the previous job
        uses: actions/download-artifact@v7
        with:
          name: nice-control-center-mc${{ matrix.mc }}
          path: mod/build/libs/

      # Pushing without raising the version refreshes the jar of that version's release.
      - name: Create or update release ${{ steps.meta.outputs.tag_name }} with changelog.log as notes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          CHANGELOG_PATH: ${{ steps.meta.outputs.changelog_path }}
          JAR_NAME: ${{ steps.meta.outputs.jar_name }}
          BUILT_JAR: ${{ steps.meta.outputs.built_jar }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: bash tools/scripts/create-or-update-github-release.sh

      - name: Delete older releases for Minecraft ${{ steps.meta.outputs.mc_version }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          MC_VERSION: ${{ steps.meta.outputs.mc_version }}
        run: bash tools/scripts/delete-older-releases.sh

  panel-build:
    name: "Panel: build and start the jar"
    needs: changes
    if: needs.changes.outputs.panel == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Make sure the Gradle wrappers are genuine
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Build the panel jar
        run: ./gradlew shadowJar

      - name: Start the panel and check that it answers
        run: |
          PANEL_PORT=18080 SERVER_DIR=$RUNNER_TEMP/server PANEL_DATA=$RUNNER_TEMP/panel PANEL_ADMIN_PASSWORD=ci \
            java -jar build/libs/nice-control-center-panel-*.jar &
          for i in $(seq 1 30); do
            curl -fs http://localhost:18080/api/health && exit 0
            sleep 1
          done
          echo "The panel didn't answer within 30 seconds"; exit 1

  panel-image:
    name: "Panel: build and push the Docker image"
    needs: [changes, panel-build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The context is the repository root, because the panel compiles shared code from mod/.
      - name: Build the image and push it as niceron/nicecontrolcenter:latest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./panel/Dockerfile
          push: true
          pull: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            niceron/nicecontrolcenter:latest
            niceron/nicecontrolcenter:sha-${{ github.sha }}
