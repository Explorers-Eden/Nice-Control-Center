# Portainer stack for the Nice Control Center Panel.
# Paste this into Portainer -> Stacks -> Add stack -> Web editor, then add PANEL_ADMIN_PASSWORD
# under "Environment variables" (without it, a password is generated and printed in the container log).
# Point your reverse proxy (Nginx Proxy Manager, Traefik, ...) at port 8080 for the panel.
services:
  nicecontrolcenter:
    image: niceron/nicecontrolcenter:latest
    container_name: nicecontrolcenter
    restart: unless-stopped
    environment:
      PANEL_ADMIN_USER: ${PANEL_ADMIN_USER:-admin}
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:-}
    ports:
      - "${PANEL_PORT:-8080}:8080"
      - "${MINECRAFT_PORT:-25565}:25565"
    volumes:
      # The Minecraft server folder (world, mods, config, logs).
      - nicecontrolcenter-server:/data/server
      - nicecontrolcenter-backups:/data/backups
      # Map tiles, served on the map subdomain.
      - nicecontrolcenter-map:/data/map
      # Panel settings (startup, Java flags).
      - nicecontrolcenter-panel:/data/panel
    # Time for the Minecraft server to save and stop when the container stops.
    stop_grace_period: 120s

volumes:
  nicecontrolcenter-server:
  nicecontrolcenter-backups:
  nicecontrolcenter-map:
  nicecontrolcenter-panel:
