<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="referrer" content="no-referrer">
	<title>Server info</title>
	<script>
		// The visitor's own light or dark preference.
		try { document.documentElement.dataset.theme = localStorage.getItem('np-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }
		catch (e) { document.documentElement.dataset.theme = 'dark'; }
	</script>
	<link rel="icon" href="../img/favicon.ico" type="image/x-icon">
	<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/bootstrap-icons.woff2?dd67030699838ea613ee6dbda90effa6" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="../app.css">
	<link rel="stylesheet" href="info.css">
</head>
<body>
	<header class="in-hero">
		<div class="in-hero-inner">
			<img class="in-logo" id="in-logo" alt="" hidden>
			<div class="in-motd" id="in-motd" hidden></div>
			<div class="in-restart" id="in-restart" hidden></div>
			<div class="in-intro" id="in-intro"></div>
			<div class="in-stats" id="in-stats"></div>
		</div>
		<button type="button" class="in-theme" id="in-theme" aria-label="Switch light/dark"><i class="bi bi-circle-half"></i></button>
	</header>
	<div class="in-bar">
		<div class="in-bar-inner">
			<button type="button" class="in-menu" id="in-menu" aria-label="Contents"><i class="bi bi-list-nested"></i><span>Contents</span></button>
			<label class="in-search"><i class="bi bi-search"></i><input type="search" id="in-q" placeholder="Search all settings…" autocomplete="off"><kbd>/</kbd></label>
		</div>
	</div>
	<div class="in-layout">
		<nav class="in-tree" id="in-tree" aria-label="Contents"></nav>
		<div class="in-content">
			<nav class="in-crumbs" id="in-crumbs" aria-label="You are here"></nav>
			<main class="in-main" id="in-main"><p class="in-empty">Loading…</p></main>
		</div>
	</div>
	<div class="in-backdrop" id="in-backdrop"></div>
	<footer class="in-foot"><span id="in-updated"></span> · Made with the Nice Control Center</footer>
	<script src="info.js"></script>
</body>
</html>
