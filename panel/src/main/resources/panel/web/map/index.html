<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="referrer" content="no-referrer">
	<title>Server map</title>
	<link rel="icon" href="../img/favicon.ico" type="image/x-icon">
	<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/bootstrap-icons.woff2?dd67030699838ea613ee6dbda90effa6" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="map.css">
</head>
<body>
	<div id="map"></div>
	<div class="mp-panel">
		<h1 id="mp-title">Server map</h1>
		<details class="mp-status" id="mp-status" open hidden>
			<summary><span class="mp-dot" id="mp-dot"></span><b id="mp-state">…</b><span class="mp-count" id="mp-count"></span><i class="bi bi-chevron-down"></i></summary>
			<div class="mp-clock" id="mp-clock" hidden></div>
			<dl class="mp-facts" id="mp-facts"></dl>
		</details>
		<div class="mp-dims" id="mp-dims"></div>
		<div class="mp-coords" id="mp-coords">–</div>
		<div class="mp-layers" id="mp-layers"></div>
		<div class="mp-players" id="mp-players"></div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="map.js"></script>
</body>
</html>
