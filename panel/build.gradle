plugins {
	id 'java'
	id 'application'
	id 'com.gradleup.shadow' version "${shadow_version}"
}

base {
	archivesName = "nice-control-center-panel"
}

repositories {
	mavenCentral()
}

// Code and web files shared with the mod are compiled straight from mod/, like NiceMerl's mod bundles
// ../bot/data. Only Minecraft-free classes may be listed here.
def modJava = "../mod/src/main/java"
def modWeb = "../mod/src/main/resources/assets/nicecontrolcenter/web"

sourceSets {
	main {
		java {
			srcDir(modJava)
			include "eu/explorerseden/nicecontrolcenter/panel/**"
			include "eu/explorerseden/nicecontrolcenter/Json.java"
			include "eu/explorerseden/nicecontrolcenter/core/SystemMetrics.java"
		}
	}
}

dependencies {
	implementation "io.javalin:javalin:${project.javalin_version}"
	implementation "com.google.code.gson:gson:${project.gson_version}"
	implementation "org.slf4j:slf4j-simple:${project.slf4j_version}"
	implementation "org.postgresql:postgresql:${project.postgres_version}"
	implementation "com.zaxxer:HikariCP:${project.hikari_version}"
	implementation "org.flywaydb:flyway-core:${project.flyway_version}"
	implementation "org.flywaydb:flyway-database-postgresql:${project.flyway_version}"
	implementation "com.password4j:password4j:${project.password4j_version}"
	implementation "org.apache.sshd:sshd-core:${project.sshd_version}"
	implementation "org.apache.sshd:sshd-sftp:${project.sshd_version}"
	// ed25519 keys and post-quantum key exchange for SFTP.
	implementation "org.bouncycastle:bcprov-jdk18on:${project.bouncycastle_version}"
	implementation "org.bouncycastle:bcpkix-jdk18on:${project.bouncycastle_version}"
	implementation "org.tomlj:tomlj:${project.tomlj_version}"
	// Discord bridge; voice isn't used.
	implementation("net.dv8tion:JDA:${project.jda_version}") {
		exclude module: "opus-java"
		exclude module: "tink"
	}
	implementation "org.yaml:snakeyaml:${project.snakeyaml_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("panel/version.txt") {
		expand "version": version
	}

	// The dashboard's look (Explorer's Eden style) comes from the mod.
	from(modWeb) {
		include "app.css", "img/**"
		into "panel/web"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

application {
	mainClass = "eu.explorerseden.nicecontrolcenter.panel.Panel"
}

shadowJar {
	archiveClassifier = ""
	// Flyway and JDBC find their plugins through META-INF/services; those lists must be merged, not
	// overwritten. Shadow 9 only merges files that the duplicates strategy lets through.
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	mergeServiceFiles()
	// Signatures of signed jars (BouncyCastle) don't match inside the fat jar and would stop it from loading.
	exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "META-INF/*.EC"
}

// The fat jar is the one that ships; the plain jar gets its own name so the two don't overwrite each other
// (Gradle refuses `build` otherwise).
jar {
	archiveClassifier = "plain"
}

tasks.withType(Jar).configureEach {
	from("LICENSE") {
		rename { "${it}_nice-control-center-panel" }
	}
}
