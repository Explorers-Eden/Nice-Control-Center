# Local testing: builds the image from this repository. For Portainer use portainer-stack.yml.
#   docker compose -f panel/docker-compose.yml up --build
services:
  panel:
    build:
      context: ..
      dockerfile: panel/Dockerfile
    ports:
      - "8080:8080"
      - "25565:25565"
      - "2022:2022"
    volumes:
      - ./run/server:/data/server
      - ./run/backups:/data/backups
      - ./run/map:/data/map
      - ./run/panel:/data/panel
    environment:
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:-}
      DB_URL: ${DB_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASS: ${DB_PASS:-}
    stop_grace_period: 120s
